[flake8]
max-line-length = 100
exclude = .git,__pycache__,build,dist,.idea,.venv
extend-ignore = E203,W503,E501, W293, F405, F401, E303, E265, W292, F401, F541, E302, F403, F824, F841

[pydocstyle]
match = .*\.py
match_dir = ^(?!\.git|__pycache__|build|dist|\.venv|\.idea).*
ignore = D203,D212,D100,D400,D415,D204,D407,D406,D413, D102, D107, D101, D104, D301, D417, D202, D200, D205, D211, D213, D401, D103